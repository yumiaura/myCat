name: Publish to WinGet

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      WINGET_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag, e.g. 0.1.38
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-winget-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-stable tag: $TAG"
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets > release.json
          if jq -e '.isDraft or .isPrerelease' release.json > /dev/null; then
            echo "Skipping draft or prerelease: $TAG"
            exit 0
          fi
          jq -e '[.assets[] | select(.name == "mycat-windows-x64.exe")] | length == 1' release.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check publishing credentials
        if: steps.release.outputs.ready == 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::error::Add the WINGET_TOKEN repository secret (classic PAT: public_repo and workflow)."
            exit 1
          fi

      - name: Submit WinGet update
        if: steps.release.outputs.ready == 'true'
        uses: vedantmgoyal9/winget-releaser@a8fff44b123f115ce4c21543edf8b677376fc7e0
        with:
          identifier: yumiaura.myCat
          installers-regex: '^mycat-windows-x64\.exe$'
          release-tag: ${{ inputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
