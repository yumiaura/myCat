name: Build AppImage

# Same tag trigger as the other release workflows. Packs the PyInstaller onefile
# Linux binary into a portable, self-contained AppImage (a single user-writable
# file that runs on most distros and can update itself in place) and attaches it
# to the GitHub Release. Also dispatchable to produce the AppImage as an artefact.

on:
  push:
    tags:
      - "*.*.*"
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # attach the AppImage to the GitHub Release

jobs:
  build-appimage:
    # The oldest supported Ubuntu LTS, not ubuntu-latest: the binary links
    # against the runner's glibc, and one built on 24.04 needs GLIBC_2.38 and
    # will not start on 22.04 (nor in the AppImage catalog test, which runs
    # there).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the X libraries Qt's xcb plugin loads, and zsync
        # PyInstaller bundles only the libraries it finds on this machine, and
        # the runner lacks some of these (libxcb-cursor0 above all). Without
        # them the AppImage quits on any system that lacks them too: "no Qt
        # platform plugin could be initialized".
        run: |
          sudo apt-get update
          # zsync provides zsyncmake, which appimagetool -u needs to write the
          # .zsync file next to the AppImage.
          sudo apt-get install -y --no-install-recommends zsync \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxkbcommon0

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
          # openai is optional, but a frozen binary can't pip-install later —
          # bundling it here makes --openai work out of the box.
          pip install openai

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm mycat.spec

      - name: Assemble AppDir and build AppImage
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          install -m0755 dist/mycat AppDir/usr/bin/mycat
          # The .desktop and icon must sit at the AppDir root (Icon=mycat ->
          # AppDir/mycat.png), and a copy under hicolor is good practice.
          install -m0644 packaging/mycat.desktop AppDir/mycat.desktop
          install -m0644 packaging/mycat.png AppDir/mycat.png
          install -m0644 packaging/mycat.png AppDir/usr/share/icons/hicolor/256x256/apps/mycat.png
          # AppStream metadata: the AppImage catalog shows its summary and
          # screenshot instead of a capture of the first-run dialog.
          install -Dm0644 packaging/io.github.yumiaura.myCat.metainfo.xml AppDir/usr/share/metainfo/io.github.yumiaura.myCat.metainfo.xml
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/mycat" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          # appimagetool from AppImage/appimagetool, not the retired AppImageKit:
          # it embeds the static type2 runtime, so the AppImage needs neither
          # libfuse2 nor the system C library to mount itself.
          wget -qO appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # --appimage-extract-and-run avoids needing FUSE on the runner.
          # -u embeds where updates live: the .zsync of the latest GitHub
          # release. The asset names are version-less, so this string never
          # changes, and AppImageUpdate, Gear Lever and similar tools fetch only
          # the changed blocks of a new release.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            -u "gh-releases-zsync|yumiaura|myCat|latest|mycat-linux-x86_64.AppImage.zsync" \
            AppDir mycat-linux-x86_64.AppImage
          # Fail rather than publish an AppImage whose update file is missing.
          test -s mycat-linux-x86_64.AppImage.zsync
          ls -la mycat-linux-x86_64.AppImage mycat-linux-x86_64.AppImage.zsync

      - uses: actions/upload-artifact@v4
        with:
          name: mycat-appimage
          path: |
            mycat-linux-x86_64.AppImage
            mycat-linux-x86_64.AppImage.zsync
          if-no-files-found: error

      - name: Attach AppImage to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mycat-linux-x86_64.AppImage
            mycat-linux-x86_64.AppImage.zsync
          fail_on_unmatched_files: true
