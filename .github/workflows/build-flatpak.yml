name: Build Flatpak

# Builds the Flatpak from packaging/flatpak/io.github.yumiaura.myCat.yml (the
# working tree, on the PySide BaseApp), runs the Flathub linter on it, installs
# the bundle and checks myCat starts and shows its window. Flathub builds and
# publishes the real thing from its own repository; this keeps the manifest
# working between releases.

on:
  push:
    tags:
      - "*.*.*"
      - "v*"
    # Also on any branch whose push touches what the Flatpak is built from.
    branches:
      - "**"
    paths:
      - "packaging/flatpak/**"
      - "packaging/io.github.yumiaura.myCat.metainfo.xml"
      - "packaging/mycat.desktop"
      - "pyproject.toml"
      - ".github/workflows/build-flatpak.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: mycat.flatpak
          manifest-path: packaging/flatpak/io.github.yumiaura.myCat.yml
          cache-key: flatpak-builder-${{ github.sha }}
          # As Flathub's own builds do: the linter wants the metainfo
          # screenshots mirrored to Flathub's media host.
          mirror-screenshots-url: https://dl.flathub.org/media

      - name: Flathub linter
        # The manifest checks are the ones Flathub runs on a submission; the
        # repo checks look at the built app (metainfo, desktop file, icon).
        run: |
          set -euo pipefail
          flatpak install -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/io.github.yumiaura.myCat.yml || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo

      - name: Install the bundle and check it starts
        # The container has Xvfb and dbus but no xwininfo and no package
        # manager, so the window check uses the python-xlib the app ships.
        run: |
          set -euo pipefail
          flatpak install -y --noninteractive --user --bundle mycat.flatpak
          Xvfb :99 -ac -screen 0 1280x800x24 &
          sleep 2
          export DISPLAY=:99
          cat > windows.py <<'PY'
          from Xlib import display

          def names(window):
              for child in window.query_tree().children:
                  name = child.get_wm_name()
                  if name:
                      yield name
                  yield from names(child)

          found = [name for name in names(display.Display().screen().root) if "mycat" in str(name).lower()]
          print("windows:", found)
          raise SystemExit(0 if found else 1)
          PY
          dbus-run-session -- sh -c '
            timeout 30 flatpak run --user io.github.yumiaura.myCat > mycat.log 2>&1 &
            sleep 20
            flatpak run --user --command=python3 --filesystem=host io.github.yumiaura.myCat "$PWD/windows.py" || { cat mycat.log; exit 1; }
          '
